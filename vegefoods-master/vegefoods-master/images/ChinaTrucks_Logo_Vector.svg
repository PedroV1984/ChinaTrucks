<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500">
  <rect width="1200" height="500" fill="white"/>
  
  <!-- Swoosh -->
  <path d="M120 360 C 80 180, 260 80, 420 120" fill="none" stroke="#002B6B" stroke-width="22"/>
  <path d="M80 400 C 240 450, 420 420, 520 360" fill="none" stroke="#8A8D91" stroke-width="16"/>

  <!-- Simplified truck icon -->
  <g fill="none" stroke="#002B6B" stroke-width="10">
    <rect x="170" y="180" width="130" height="110" rx="8"/>
    <polygon points="300,210 360,210 390,250 390,290 300,290"/>
    <line x1="190" y1="205" x2="280" y2="205"/>
    <line x1="185" y1="235" x2="290" y2="235"/>
    <line x1="180" y1="265" x2="290" y2="265"/>
    <circle cx="220" cy="315" r="30"/>
    <circle cx="360" cy="315" r="30"/>
  </g>

  <!-- Brand -->
  <text x="450" y="220" font-family="Arial, Helvetica, sans-serif"
        font-size="120" font-weight="900" font-style="italic"
        fill="#002B6B">CHINA</text>

  <text x="440" y="340" font-family="Arial, Helvetica, sans-serif"
        font-size="120" font-weight="900" font-style="italic"
        fill="#8A8D91">TRUCKS</text>

  <!-- Tagline -->
  <line x1="380" y1="410" x2="500" y2="410" stroke="#8A8D91" stroke-width="4"/>
  <line x1="890" y1="410" x2="1030" y2="410" stroke="#8A8D91" stroke-width="4"/>

  <text x="520" y="425" font-family="Arial, Helvetica, sans-serif"
        font-size="34" font-weight="700"
        fill="#002B6B">CALIDAD QUE MUEVE KILÓMETROS</text>
</svg>
